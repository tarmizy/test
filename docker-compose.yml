services:
  mywebsite:
    build: .
    image: mywebsite:latest
    container_name: mywebsite
    hostname: mywebsite.local
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mywebsite
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "80:80"
      - "443:443"
      - "3306:3306"     
    volumes:
      - mysql_data:/var/lib/mysql        
      - ./src:/var/www/mywebsite         

volumes:
  mysql_data:
