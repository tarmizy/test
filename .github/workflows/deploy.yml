name: CI/CD - Build & Deploy ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: /opt/mywebsite

jobs:
  # ---------------------------------------------------------------
  # 1) Download repo + build image APP (tanpa MySQL) + push ke GHCR
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set nama image & tag
        id: vars
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 2) Deploy ke VPS: HANYA service app yang di-update, DB tidak disentuh
  # ---------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kirim docker-compose.prod.yml ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy app (DB tidak di-update)
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE,TAG,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN,MYSQL_ROOT_PASSWORD,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD
          script: |
            set -e
            cd "$DEPLOY_DIR"
            mkdir -p certs
            DC="docker compose -f docker-compose.prod.yml"

            # .env hanya berisi versi image app (di-update tiap deploy)
            printf 'IMAGE=%s\nTAG=%s\n' "$IMAGE" "$TAG" > .env

            # Kredensial DB: dibuat SEKALI, deploy berikutnya tidak menimpa
            if [ ! -f db.env ]; then
              printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_DATABASE=%s\nMYSQL_USER=%s\nMYSQL_PASSWORD=%s\n' \
                "$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" "$MYSQL_USER" "$MYSQL_PASSWORD" > db.env
              chmod 600 db.env
            fi

            # Migrasi sekali dari versi single-container lama (jika ada)
            if docker ps -a --format '{{.Names}}' | grep -qx mywebsite; then
              docker rm -f mywebsite
            fi

            # DB: hanya dibuat jika belum ada, dijalankan jika berhenti. Tidak pernah di-pull/recreate.
            if [ -z "$($DC ps -a -q db)" ]; then
              $DC up -d db
            else
              $DC start db
            fi

            # App: pull image baru & recreate HANYA service app
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            $DC pull app
            $DC up -d --no-deps app
            docker logout ghcr.io
            docker image prune -f

            # Health check
            for i in $(seq 1 30); do
              if curl -fsk -o /dev/null -H "Host: mywebsite.local" https://localhost; then
                echo "Deploy OK -> $IMAGE:$TAG (DB tidak disentuh)"
                exit 0
              fi
              sleep 3
            done
            echo "Health check gagal"
            $DC logs --tail=100 app
            exit 1